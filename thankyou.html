<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ขอบคุณที่สั่งซื้อ | Body Scent</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fbf8f2">
  <link rel="stylesheet" href="style.css">
  <style>
    /* เฉพาะหน้าขอบคุณ */
    .thanks {
      min-height: calc(100vh - 4.5rem);
      min-height: calc(100svh - 4.5rem);
      display: grid;
      place-items: center;
      padding-block: var(--space-6);
      text-align: center;
    }
    .thanks__line { display: block; width: 1px; height: 3.5rem; margin: 0 auto var(--space-4); background: var(--accent); }
    .thanks h1 { font-size: var(--fs-xl); font-weight: 400; line-height: 1.6; }
    .thanks p { margin: var(--space-3) auto 0; }
    .thanks .btn { margin-top: var(--space-5); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="thanks">
      <div class="container">
        <span class="thanks__line" aria-hidden="true"></span>
        <h1>ขอบคุณที่สั่งซื้อ</h1>
        <p>เราได้รับคำสั่งซื้อของคุณแล้ว และจะติดต่อกลับเพื่อยืนยันรายละเอียดอีกครั้ง</p>
        <a href="index.html" class="btn">กลับหน้าแรก</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; Body Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
